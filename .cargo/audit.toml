# Read by both `cargo audit` locally and the rustsec/audit-check CI job, so
# the two always agree.
#
# Only add an entry with a reason and the condition that removes it. An audit
# job that is permanently red teaches everyone to ignore it, which is worse
# than not having one.

[advisories]
ignore = [
    # quick-xml: quadratic parse of duplicate attribute names, and unbounded
    # namespace-declaration allocation in NsReader. Both are denial-of-service
    # against a parser fed hostile XML.
    #
    # Not reachable here. quick-xml arrives only transitively and never sees
    # untrusted input:
    #   0.38.x <- plist <- syntect / tui-markdown  (parses the .tmTheme syntax
    #             and theme files WE ship, not user or network data)
    #   0.39.x <- wayland-scanner <- ... <- wl-clipboard-rs  (a proc-macro:
    #             runs at build time against the wayland protocol XML in the
    #             dependency itself)
    #
    # Fix requires syntect/plist and the wayland stack to move to
    # quick-xml >= 0.41; nothing in this repo pins it. Re-check on any
    # syntect or wl-clipboard-rs bump and drop these lines when they clear.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # hickory-proto 0.25.2 via reqwest hickory-dns: NSEC3 closest-encloser unbounded loop (0118, no fix)
    # and NSEC3 resource exhaustion (0119, needs >=0.26.1). reqwest 0.12 pins hickory 0.25,
    # so no upgrade available. Not reachable: hickory is used only as a client-side
    # DNS resolver for OpenRouter (happy-eyeballs IPv4 fallback), not as a DNS
    # server doing DNSSEC validation of hostile cross-zone responses.
    # Re-check when reqwest bumps hickory to >=0.26.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # hickory-proto/resolver 0.25.2 via reqwest 0.12 hickory-dns: the OpenRouter
    # client uses it purely as a stub resolver (openrouter.rs, IPv4 fallback).
    # 0487/0489/0490 panic on DNS *text* input (FromStr/zone lexer) — never
    # parsed here (wire format only); 0491 amplifies from wire header counts,
    # exposed at most to the configured upstream like any stub resolver, with
    # no DNSSEC validation enabled. 0504/0505/0511/0512/0514/0530/0531/0532
    # are DNSSEC-validation logic flaws (same non-reachability as 0118/0119).
    # Blocked: reqwest 0.12 pins hickory-resolver ^0.25 (verified: forcing
    # 0.26.2 fails resolution), and 7 have no fixed hickory release at all.
    # Re-check when reqwest moves to hickory >=0.26; drop the fixed IDs then.
    "RUSTSEC-2026-0487",
    "RUSTSEC-2026-0489",
    "RUSTSEC-2026-0490",
    "RUSTSEC-2026-0491",
    "RUSTSEC-2026-0504",
    "RUSTSEC-2026-0505",
    "RUSTSEC-2026-0511",
    "RUSTSEC-2026-0512",
    "RUSTSEC-2026-0514",
    "RUSTSEC-2026-0530",
    "RUSTSEC-2026-0531",
    "RUSTSEC-2026-0532",
    # hickory-proto 0.25.2 via reqwest 0.12 hickory-dns, same stub-resolver
    # non-reachability as above: 0549/0550/0551 are NSEC/NSEC3 nonexistence-proof
    # and cross-class-record DNSSEC validation flaws — this build never enables
    # DNSSEC validation. Re-check when reqwest moves to hickory >=0.26.
    "RUSTSEC-2026-0549",
    "RUSTSEC-2026-0550",
    "RUSTSEC-2026-0551",
]
