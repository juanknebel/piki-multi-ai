[package]
name = "piki-core"
version.workspace = true
edition = "2024"

[dependencies]
# Terminal multiplexer engine: PTY, vt100 terminal state, shell integration,
# persistent-session daemon.
piki-multiplex = { git = "https://github.com/juanknebel/piki-multiplex", branch = "main" }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "fs"] }

# File watching
notify = "8"

# Gitignore-aware directory walk (fuzzy file index; sibling of ripgrep)
ignore = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Fast synchronization primitives
parking_lot = "0.12"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

# System info
systemstat = "0.2.6"
chrono = "0.4.44"

# Desktop notifications (OS-level via libnotify / NSUserNotification / WinRT).
# Used by `notifications` module — fire-and-forget, failures logged via tracing.
notify-rust = "4"

# SQLite storage backend
rusqlite = { version = "0.40", features = ["bundled"] }

# Unix system calls (getpwuid_r, setsid)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
