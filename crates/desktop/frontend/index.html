<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piki Desktop</title>
  </head>
  <body>
    <div id="app">
      <nav id="menu-bar"></nav>
      <aside id="activity-bar"></aside>
      <div id="sidebar">
        <div id="sidebar-views">
          <div id="explorer-view" style="display:flex;flex-direction:column;height:100%">
            <section id="workspace-list"></section>
          </div>
          <div id="files-view" style="display:none;flex-direction:column;height:100%"></div>
          <div id="source-control-view" style="display:none"></div>
        </div>
        <!-- Agents panel: docked below whichever view is active, ALWAYS visible -->
        <div id="agents-resize-h"></div>
        <div id="agents-view"></div>
      </div>
      <div id="sidebar-resize-v"></div>
      <div id="editor-area">
        <main id="main-content"></main>
      </div>
      <div id="chat-resize-v"></div>
      <aside id="chat-panel"></aside>
      <footer id="status-bar"></footer>
    </div>
    <div id="overlay-container"></div>
    <div id="toast-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
