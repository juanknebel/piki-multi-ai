name: Nightly

on:
  push:
    branches:
      - nightly
  # Without this a PR (from a fork or otherwise) gets no checks at all.
  # Only the `test` job runs for PRs — see the `if:` guards on the build,
  # build-desktop and release jobs, which stay push-only.
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting is platform-independent; one leg is enough.
      - name: Format check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude piki-desktop --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude piki-desktop

  build:
    needs: test
    # Artifacts and releases are for the nightly branch only; a PR just needs
    # the `test` job above.
    if: github.event_name == 'push'
    strategy:
      # Report both platforms; a macOS-only failure shouldn't cancel Linux
      # and leave you guessing whether it was platform-specific.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: piki-multi-ai-linux-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: piki-multi-ai-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p agent-multi

      # Cheapest possible proof the binary actually links and starts —
      # snapshot tests render into a TestBackend and never exec anything.
      - name: Smoke test the binary
        run: ./target/${{ matrix.target }}/release/piki-multi-ai --version

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}.tar.gz piki-multi-ai
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  build-desktop:
    needs: test
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/desktop/frontend/package-lock.json

      # `npm ci` (not `install`): reproducible from the lockfile, and it fails
      # loudly when package.json and the lockfile disagree.
      - name: Build frontend
        run: cd crates/desktop/frontend && npm ci && npm run build

      - name: Generate platform icons
        run: npx @tauri-apps/cli icon crates/desktop/icons/icon.png --output crates/desktop/icons

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      # piki-desktop is excluded from the `test` job (tauri-build needs
      # frontend/dist, built above), so this is the only place its Rust is
      # linted and tested at all.
      - name: Clippy (desktop)
        run: cargo clippy -p piki-desktop --all-targets -- -D warnings

      - name: Test (desktop)
        run: cargo test -p piki-desktop

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/desktop
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":""}}'

      - name: Collect desktop bundles
        run: |
          mkdir -p desktop-bundles
          cp target/${{ matrix.target }}/release/bundle/deb/*.deb desktop-bundles/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg desktop-bundles/ 2>/dev/null || true
          ls -la desktop-bundles/

      - name: Package desktop binary (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: tar czf desktop-bundles/piki-desktop-linux-amd64.tar.gz -C target/${{ matrix.target }}/release piki-desktop

      - name: Package desktop binary (macOS only)
        if: matrix.os == 'macos-latest'
        run: tar czf desktop-bundles/piki-desktop-macos-arm64.tar.gz -C target/${{ matrix.target }}/release piki-desktop

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: desktop-bundles/

  release:
    needs: [build, build-desktop]
    # Implied by its needs being skipped on a PR, but stated so nobody has to
    # reason about skip propagation to be sure a PR can't publish a release.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Package Linux bundle
        run: |
          mkdir -p piki-linux-amd64
          tar xzf piki-multi-ai-linux-amd64.tar.gz -C piki-linux-amd64/
          tar xzf piki-desktop-linux-amd64.tar.gz -C piki-linux-amd64/
          cp packaging/linux/install.sh piki-linux-amd64/
          cp packaging/linux/README.md piki-linux-amd64/
          cp crates/desktop/icons/icon.png piki-linux-amd64/
          cp -r themes piki-linux-amd64/themes
          cp config.example.toml piki-linux-amd64/
          chmod +x piki-linux-amd64/install.sh
          tar czf piki-linux-amd64.tar.gz piki-linux-amd64/

      - name: Package macOS bundle
        run: |
          mkdir -p piki-macos-arm64
          tar xzf piki-multi-ai-macos-arm64.tar.gz -C piki-macos-arm64/
          tar xzf piki-desktop-macos-arm64.tar.gz -C piki-macos-arm64/
          cp packaging/macos/install.sh piki-macos-arm64/
          cp packaging/macos/README.md piki-macos-arm64/
          cp -r themes piki-macos-arm64/themes
          cp config.example.toml piki-macos-arm64/
          chmod +x piki-macos-arm64/install.sh
          tar czf piki-macos-arm64.tar.gz piki-macos-arm64/

      - name: Delete existing nightly release
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name=="nightly-latest") | .id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ]; then
            gh api -X DELETE repos/${{ github.repository }}/releases/$RELEASE_ID
          fi
          git push origin :refs/tags/nightly-latest 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create nightly release
        run: |
          gh release create nightly-latest \
            --title "Nightly $(date -u +%Y-%m-%d)" \
            --notes "$(cat <<'NOTES'
          Automated nightly build from the `nightly` branch.

          **Commit:** ${{ github.sha }}
          **Built at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ### macOS
          The `.dmg` is not signed. After mounting and dragging to Applications, remove the quarantine attribute:
          ```
          xattr -cr /Applications/Piki\ Desktop.app
          ```
          Or right-click the app and select **Open** to bypass Gatekeeper.

          > This is a pre-release. For stable versions, see the [latest release](../../releases/latest).
          NOTES
          )" \
            --prerelease \
            *.tar.gz *.deb *.dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
