name: Security audit

# Advisories land against dependencies we already have, so a schedule matters
# more than a per-push run. Also fires whenever the dependency set changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - nightly
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Plain `cargo audit` rather than rustsec/audit-check: that action
      # publishes results through the checks API, which needs `checks: write`
      # and is unavailable to the read-only token a fork's pull request gets —
      # it fails the job even when the audit itself is clean. Running the tool
      # directly needs no API access and behaves the same everywhere.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Reads .cargo/audit.toml for the ignore list (same as running it
      # locally). Exits non-zero on vulnerabilities; unmaintained/unsound
      # advisories are reported as warnings and do not fail the build.
      - name: cargo audit
        run: cargo audit
