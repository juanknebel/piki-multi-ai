name: Security audit

# Advisories land against dependencies we already have, so a schedule matters
# more than a per-push run. Also fires whenever the dependency set changes.
on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - nightly
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
