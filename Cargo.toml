[workspace]
members = ["crates/core", "crates/tui", "crates/api-client", "crates/agent", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "3.0.0-beta"

# vt100 fork with two patches, now maintained at
# https://github.com/juanknebel/piki-vt100 (extracted from vendor/vt100):
# 1. Scrollback: lines scrolled off a scroll region anchored at row 0 are
#    pushed into scrollback, matching real terminals. Codex-style inline TUIs
#    (ratatui `insert_before`) publish their transcript that way; without the
#    patch vt100 discards it and mouse-wheel scrollback over those tabs has
#    nothing to show.
# 2. `Screen::restore_formatted()`: serializes scrollback + primary screen +
#    alternate screen + cursor/attrs/input modes so the session daemon can
#    rebuild a terminal on a re-attaching client (docs/persistent-sessions.md).
#
# piki-tui depends on `vt100` directly (rendering, via tui-term) and
# piki-multiplex (below) depends on it too — both must resolve to this same
# patched fork, hence the patch stays here at the workspace root rather than
# only inside piki-multiplex's own manifest (patches don't propagate
# downstream through a dependency graph — see piki-multiplex/README.md).
[patch.crates-io]
vt100 = { git = "https://github.com/juanknebel/piki-vt100", branch = "main" }
